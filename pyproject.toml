[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silent-failure-lint"
version = "0.1.1"
description = "Static checks for silently-swallowed async/IO failures in Python: bare excepts, fire-and-forget tasks, gather() without return_exceptions, missing request timeouts, and retry loops without backoff."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "StackScribe AI", email = "survivalagent320@gmail.com" }]
keywords = ["linter", "static-analysis", "asyncio", "error-handling", "reliability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/stackscribe-ai/silent-failure-lint"
"Further reading" = "https://stackscribe-paywall.stackscribe-paywall-worker.workers.dev/"

[project.scripts]
sflint = "sflint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
